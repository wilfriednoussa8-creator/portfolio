  <ul class="nav-links">

<div class="container">

  <header class="module-header">
    <span class="eyebrow">&gt; playground / math_x_code</span>
    <h1>Math × Code</h1>
    <p>Choisis une fonction, ajuste ses paramètres avec les curseurs, et regarde la courbe se redessiner en direct.</p>
  </header>

  <div class="playground-layout">
    <aside class="controls-panel">
      <h3>&gt; parameters</h3>

      <div class="control-group">
        <label for="function-select">Fonction</label>
        <select id="function-select">
          <option value="quadratic">Quadratique — ax² + bx + c</option>
          <option value="sine">Sinusoïde — a·sin(bx + c)</option>
          <option value="exponential">Exponentielle — a·e^(bx)</option>
        </select>
      </div>

      <div class="control-group">
        <label for="param-a">a <span class="value" id="value-a">1.0</span></label>
        <input type="range" id="param-a" min="-5" max="5" step="0.1" value="1">
      </div>

      <div class="control-group">
        <label for="param-b">b <span class="value" id="value-b">1.0</span></label>
        <input type="range" id="param-b" min="-5" max="5" step="0.1" value="1">
      </div>

      <div class="control-group">
        <label for="param-c">c <span class="value" id="value-c">0.0</span></label>
        <input type="range" id="param-c" min="-5" max="5" step="0.1" value="0">
      </div>
    </aside>

    <main class="visualization-panel">
      <canvas id="math-canvas"></canvas>
      <div class="result-line" id="result-line">&gt; f(x) = ...</div>
    </main>
  </div>

</div>

<script src="../js/main.js"></script>
<script src="../js/math-code.js"></script>
<script src="../js/chatbot.js"></script>
</body>
</html>
